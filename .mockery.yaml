# Mocks for every interface (go-project-standard.md 9). Regenerate with
#   go run github.com/vektra/mockery/v2@v2.53.7
# and never edit the output by hand; CI fails when the mocks drift.
with-expecter: true
dir: "{{.InterfaceDir}}/mocks"
outpkg: mocks
mockname: "{{.InterfaceName}}"
filename: "{{.InterfaceName | snakecase}}.go"
disable-version-string: true
resolve-type-alias: false
issue-845-fix: true
packages:
  github.com/dombyte/datalogger/internal/datasource/modbus:
    interfaces:
      Client:
      Dialer:
  github.com/dombyte/datalogger/internal/datasource/http:
    interfaces:
      Client:
