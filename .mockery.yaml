# Mock generation: go tool mockery
# Mocks live next to the consumer package in internal/<pkg>/mocks and are never hand-edited;
# CI fails when they drift (AGENTS.md 2, 9.5).
template: testify
template-data:
  unroll-variadic: true
dir: "{{.InterfaceDir}}/mocks"
structname: "Mock{{.InterfaceName}}"
pkgname: mocks
filename: "mock_{{.InterfaceName | snakecase}}.go"
packages:
  github.com/dombyte/datalogger/internal/datasource/modbus:
    interfaces:
      Client:
      Dialer:
  github.com/dombyte/datalogger/internal/datasource/http:
    interfaces:
      Client:
  github.com/dombyte/datalogger/internal/datasource:
    interfaces:
      DeviceReader:
  github.com/dombyte/datalogger/internal/output:
    interfaces:
      Writer:
  github.com/dombyte/datalogger/internal/output/influxdb:
    interfaces:
      Client:
  github.com/dombyte/datalogger/internal/output/mqtt:
    interfaces:
      Publisher:
      Dialer:
