---
services:
  app:
    image: ghcr.io/dombyte/datalogger:latest
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080" # only needed for an output of type api
    environment:
      - TZ=Europe/Berlin
    command: -config=/app/config.yaml
    restart: unless-stopped
    # The image runs as root unless you set a user; any user works if it may read
    # config.yaml and write ./data, e.g.:
    # user: "1000:1000"
    # The image checks its health with "datalogger -healthcheck" every 30 s (docker ps
    # shows healthy/unhealthy); docker compose exec app /app/datalogger -status prints
    # the status of every device and output.
