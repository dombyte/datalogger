# Datalogger example configuration
#
# Copy this file to ./config.yaml (gitignored) and adapt it:
#   cp example/config.yaml config.yaml
#   datalogger -config config.yaml [-debug]
#
# Never commit real addresses, tokens or passwords. Keep them in your local config.yaml.
#
# Durations use Go syntax: 250ms, 1s, 30s, 5m, 1h.

# =====================================================================================
# Lookups (optional): named tables of integer code -> text for point expressions, used as
# lookups.<name>[code]. Codes may be written in hex (0x1004) or decimal. Names are
# lowercase (uppercase letters are lowercased when the file is read).
# =====================================================================================
lookups:
  solis_status:
    0x0000: Waiting
    0x0001: OpenRun
    0x0002: SoftRun
    0x0003: Generating
    0x0004: Standby
    0x000F: Normal
    0x1004: Grid Off
    0x1015: NO-Grid

# =====================================================================================
# Devices: where data is read from. Every device needs a unique name and at least one
# point. type is "modbus" or "http".
#
# Common device options:
#   poll_interval  how often the device is polled (required, > 0); the first poll
#                  runs at startup
#   timeout        maximum time to wait for one response
#                  (default: poll_interval, at most 10s)
#   parallelism    1-100; Modbus requests share one connection and are sent one at a
#                  time anyway, so 1 is the right value (no effect for HTTP).
#
# Point names must be unique within a device and must not contain "/".
#
# Every point MAY have an expr (https://expr-lang.org/docs/language-definition) that
# replaces its value after scale and offset. It sees:
#   value             the value of this point
#   points.<name>     the values of all points of the same poll (before any expr ran;
#                     nil if that point could not be read in this poll)
#   lookups.<name>    the lookup tables above
# Numbers become float64; true/false and text are kept; nil skips the point for this
# poll. Bit functions need integers: bitand(int(value), 0x0004). An expr that does not
# compile or names an unknown point or lookup stops startup; one that fails while
# running skips the point (warned once).
# =====================================================================================
devices:
  # ----- Modbus TCP, range mode --------------------------------------------------------
  # range mode reads the listed register ranges (inclusive, split into requests of at most
  # 125 registers) and decodes all points from them. Every point must lie inside a range.
  # If any range read fails, the whole poll is skipped (no partial data).
  - name: inverter
    type: modbus
    poll_interval: 5s
    timeout: 2s
    parallelism: 1
    device_specific:
      modbus:
        address: "tcp://192.0.2.10:502"
        slave_id: 1
        register_mode: range
        ranges: ["33049-33058", "33095-33121", "33135-33150"]
    # Point options (Modbus):
    #   register       start register address
    #   count          number of registers: 1 for 16-bit types and bool,
    #                  2 for int32/uint32/float32 (high word first; required)
    #   type           int16, uint16, int32, uint32, float32, bool
    #   function_code  3 = holding registers, 4 = input registers. One register type per
    #                  device (mixing is rejected): configure a second device for both.
    #   scale, offset  value = raw * scale + offset (scale defaults to 1, offset to 0).
    #   unit           free text, passed to the outputs
    points:
      - name: pv_voltage_1
        register: 33049
        count: 1
        type: uint16
        function_code: 4
        scale: 0.1
        offset: 0
        unit: "V"
      - name: total_pv_power
        register: 33057
        count: 2
        type: uint32
        function_code: 4
        scale: 1
        offset: 0
        unit: "W"
      # Expressions: the status code as text, one bit of a fault register, and a
      # sign from another point of the same poll.
      - name: status
        register: 33095
        type: uint16
        function_code: 4
      - name: status_text # same register, decoded with the lookup table
        register: 33095
        type: uint16
        function_code: 4
        expr: 'lookups.solis_status[int(value)] ?? "unknown"'
      - name: fault_no_grid # bit 0 of the grid fault register
        register: 33116
        type: uint16
        function_code: 4
        expr: "bitand(int(value), 0x0001) != 0"
      - name: battery_current_direction # 0 = charging, 1 = discharging
        register: 33135
        type: uint16
        function_code: 4
      - name: battery_soc
        register: 33139
        count: 1
        type: uint16
        function_code: 4
        scale: 1
        offset: 0
        unit: "%"
      - name: battery_power # positive while discharging, negative while charging
        register: 33149
        count: 2
        type: uint32
        function_code: 4
        scale: 1
        offset: 0
        unit: "W"
        expr: "points.battery_current_direction == 1 ? value : -value"

  # ----- Modbus RTU (serial), direct mode ----------------------------------------------
  # direct mode reads every point on its own. A failing point is skipped; the other points
  # of the poll are still delivered.
  - name: sensor_rtu
    type: modbus
    poll_interval: 10s
    timeout: 3s
    parallelism: 1
    device_specific:
      modbus:
        address: "rtu:///dev/ttyUSB0"
        slave_id: 1
        speed: 9600
        data_bits: 8
        parity: "N" # N = none, E = even, O = odd
        stop_bits: 1
        register_mode: direct
    points:
      - name: temperature
        register: 100
        count: 1
        type: int16
        function_code: 3
        scale: 0.1
        offset: 0
        unit: "C"
      - name: alarm_active
        register: 110
        count: 1
        type: bool
        function_code: 3
        scale: 1
        offset: 0
        unit: ""

  # ----- HTTP GET, JSON response -------------------------------------------------------
  # Values are read with gjson paths: https://github.com/tidwall/gjson/blob/master/SYNTAX.md
  # Without type, numbers become float64 and booleans and strings stay; set type
  # (float64, int64, uint64, bool, string) to convert explicitly (numbers sent as strings
  # included). null, objects/arrays (without type: string) and values that do not fit the
  # type are skipped and logged. scale and offset apply to
  # numbers (value * scale + offset, delivered as float64); with the defaults (1, 0) values
  # keep their type.
  - name: energy_meter
    type: http
    poll_interval: 1s
    timeout: 2s
    parallelism: 1
    device_specific:
      http:
        address: "http://192.0.2.20/rpc/EM.GetStatus"
        method: GET
        headers:
          Accept: "application/json"
        response_type: json
        insecure: false # true skips TLS certificate verification (self-signed devices)
    points:
      - name: a_voltage
        json_path: "a_voltage"
        unit: "V"
      - name: total_act_power
        json_path: "total_act_power"
        unit: "W"
      - name: freq
        json_path: "freq"
        unit: "Hz"

  # ----- HTTP POST with body and auth header -------------------------------------------
  # response_type: json (default) or text (the whole body as one string value).
  - name: cloud_api
    type: http
    poll_interval: 1m
    timeout: 10s
    parallelism: 2
    device_specific:
      http:
        address: "https://api.example.com/v1/status"
        method: POST
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
          Authorization: "Bearer <your-api-token>"
        body: '{"action": "GetStatus"}'
        response_type: json
    points:
      - name: online
        json_path: "status.online"
        type: bool
      - name: first_measurement
        json_path: "data.measurements.0.value"
        type: float64
        unit: "kW"

# =====================================================================================
# Outputs: where data is written to. type is "influxdb", "mqtt" or "csv".
#
# Common output options:
#   devices      the devices whose readings this output receives (must exist above)
#   buffer_size  queued points for this output (default 1000). When the queue is full,
#                new points are dropped for this output only and a warning is logged.
#   exclude_points  "device/point" names this output does not receive (optional), e.g.
#                text values for InfluxDB, where a field keeps one type per device.
# =====================================================================================
outputs:
  # ----- InfluxDB 3 --------------------------------------------------------------------
  # Schema: measurement = device name, tags "point" and "unit", field "value".
  # batch_size, batch_timeout, max_retries and retry_delay apply to InfluxDB only.
  - name: influxdb
    type: influxdb
    buffer_size: 10000
    batch_size: 10000 # write when this many points are queued (default 10000)
    batch_timeout: 1s # ... or after this time (default 1s)
    max_retries: 3 # retries per batch before it is dropped (default 3)
    retry_delay: 1s # wait between retries (default 1s)
    output_specific:
      influxdb:
        address: "http://influxdb.example.com:8181"
        token: "<your-influxdb-token>"
        database: "datalogger"
        insecure: false
    devices:
      - inverter
      - energy_meter
    # status_text is text and fault_no_grid true/false; the numeric status is kept.
    exclude_points:
      - inverter/status_text
      - inverter/fault_no_grid

  # ----- MQTT with authentication ------------------------------------------------------
  # Topic per point: <topic>/<device>/<point>; topic, device and point names must not
  # contain + or # (list such points in exclude_points).
  # Payload: {"value": ..., "unit": "...", "timestamp": "<RFC3339 with nanoseconds>"}
  # address schemes: tcp:// or mqtt:// (default when omitted), tls://, ssl:// or mqtts://
  # (verified TLS).
  # While the broker is unreachable, points for this output are dropped (and counted).
  - name: mqtt
    type: mqtt
    buffer_size: 1000
    output_specific:
      mqtt:
        address: "tcp://mqtt.example.com:1883"
        client_id: "datalogger-01" # default: logger-<8 random characters>
        topic: "datalogger" # default: datalogger
        qos: 1 # 0, 1 or 2
        retain: false
        username: "<user>"
        password: "<password>"
        insecure: false
    devices:
      - inverter
      - sensor_rtu

  # ----- CSV file with rotation --------------------------------------------------------
  # Columns: timestamp, device, point, value, unit. Every point is flushed immediately.
  # When the file is older than max_age it is renamed to <file>.<YYYYMMDD-HHMMSS> and a new
  # file is started. max_backups: 0 = keep no rotated files, > 0 = keep that many,
  # < 0 = keep all. In the container, write below /app/data (mounted from ./data).
  - name: csv
    type: csv
    buffer_size: 10000
    output_specific:
      csv:
        file_path: "./data/data.csv"
        max_age: 24h
        max_backups: 7
    devices:
      - inverter
      - sensor_rtu
      - energy_meter
      - cloud_api

  # ----- HTTP API (latest values) ------------------------------------------------------
  # Read-only JSON API with the latest value of every point and its age in milliseconds:
  #   GET /api/devices                   devices with point count and age of the newest point
  #   GET /api/devices/<device>          {"device", "points": {<point>: {value, unit,
  #                                       timestamp, age_ms}}}
  #   GET /api/devices/<device>/<point>  one point
  #   GET /healthz                       200 without token
  # Values are kept in memory only (empty after a restart). In the container, publish the
  # port (ports: ["8080:8080"]).
  - name: api
    type: api
    output_specific:
      api:
        listen: ":8080" # host:port; "127.0.0.1:8080" for local access only
        token: "" # optional: require "Authorization: Bearer <token>"
    devices:
      - inverter
      - energy_meter
